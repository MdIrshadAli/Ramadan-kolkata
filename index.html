/* ===== UTILITIES ===== */

function calculateDuration(date,start,end){
    const s = new Date(date+" "+start);
    const e = new Date(date+" "+end);
    const diff = e - s;
    const h = Math.floor(diff/(1000*60*60));
    const m = Math.floor((diff%(1000*60*60))/(1000*60));
    return h+"h "+('0'+m).slice(-2)+"m";
}

    if(new Date(d.Date).toDateString()===todayString){
        todayData = d;
    }
});

data.forEach(d=>{
    const tr=document.createElement("tr");

    if(new Date(d.Date).toDateString()===todayString){
        tr.classList.add("highlight");
    }

    tr.innerHTML=`
    <td>${d.Sl_No}</td>
    <td>${d.Date}</td>
    <td>${d.Suhoor}</td>
    <td>${d.Iftar}</td>
    <td>${calculateDuration(d.Date,d.Suhoor,d.Iftar)}</td>
    `;
    tbody.appendChild(tr);
});

    document.getElementById("todayDate").innerText=
        "Date: "+todayData.Date;

    document.getElementById("todaySuhoor").innerText=
        "Suhoor: "+todayData.Suhoor;

    document.getElementById("todayIftar").innerText=
        "Iftar: "+todayData.Iftar;

    document.getElementById("hadithText").innerText=
        todayData.hadith;

    startCountdown(todayData);
}

/* ===== COUNTDOWN ===== */

function startCountdown(d){

    const suhoor = new Date(d.Date+" "+d.Suhoor);
    const iftar = new Date(d.Date+" "+d.Iftar);

    let target;
    let label;

    if(new Date()<iftar){
        target=iftar;
        label="Next Iftar In";
    }else{
        target=new Date(suhoor);
        target.setDate(target.getDate()+1);
        label="Next Suhoor In";
    }

    document.getElementById("nextLabel").innerText=label;

    const circle=document.querySelector(".progress-ring-circle");
    const radius=110;
    const circumference=2*Math.PI*radius;
    circle.style.strokeDasharray=circumference;

    function update(){
        const now=new Date();
        const diff=target-now;

        if(diff<=0){ location.reload(); }

        const h=Math.floor(diff/(1000*60*60));
        const m=Math.floor((diff%(1000*60*60))/(1000*60));
        const s=Math.floor((diff%(1000*60))/1000);

        document.getElementById("countdownTime").innerText=
            ('0'+h).slice(-2)+":"+
            ('0'+m).slice(-2)+":"+
            ('0'+s).slice(-2);

        document.getElementById("currentTime").innerText=
            now.toLocaleTimeString();

        const total=target - new Date(d.Date+" 00:00");
        const elapsed=now - new Date(d.Date+" 00:00");
        const progress=elapsed/total;
        circle.style.strokeDashoffset=
            circumference-(progress*circumference);
    }

    setInterval(update,1000);
    update();
}
